; Arduino example using the shared board definitions.
; In a real project, esp32-boards is a git submodule at boards/ and [boards] dir = boards.
;
;   pio run -e m15_esp32s3 -t upload -t monitor

[platformio]
extra_configs = ../../boards.ini
default_envs = m15_esp32s3
; Keep build output OUTSIDE OneDrive (synced build files get locked / vanish).
build_dir = C:/pio-build/esp32-boards-arduino-blink

[boards]
dir = ../..

[env]
framework = arduino
build_flags =
lib_deps =
