; =============================================================================
; esp32-boards: shared hardware types + inventory of physical modules
; =============================================================================
;
; Included by a project's platformio.ini (this repo is a git submodule at boards/):
;
;   [platformio]
;   extra_configs = boards/boards.ini
;   [boards]
;   dir = boards                 ; path of this repo, relative to the project
;   [env]
;   framework = espidf           ; or: arduino
;   build_flags =                ; app-wide flags, appended for every module
;
; Every hw_* section carries the settings for BOTH frameworks; PlatformIO ignores
; the ones that don't apply:
;   ESP-IDF : board_build.cmake_extra_args -> sdkconfig defaults (flash, PSRAM, console)
;   Arduino : board_build.arduino.memory_type, -DBOARD_HAS_PSRAM, -DARDUINO_USB_CDC_ON_BOOT
;
; ESP-IDF projects must have their own sdkconfig.defaults in the project root (it may be
; empty). It is applied AFTER the board defaults, so the app can override them.
; NOTE: sdkconfig defaults are only applied when sdkconfig.<env> is (re)generated -
;       after changing a defaults file, delete the matching sdkconfig.<env> file(s).
;
; Do not edit this file inside a project: change it in the esp32-boards repo, then
; update the submodule in each project.

; ===== shared by all hardware types ===========================================
[boards_base]
platform = espressif32
monitor_speed = 115200
; Compiles the board sources (src/) together with the app, for both frameworks.
build_src_filter = +<*> +<../${boards.dir}/src/>

; ===== hardware types =========================================================

; DOIT ESP32 DEVKIT V1 (30-pin) - ESP32-WROOM-32, 4 MB quad flash, no PSRAM
[hw_doit_esp32]
extends = boards_base
board = esp32doit-devkit-v1
build_flags = -I ${boards.dir}/include -DBOARD_DOIT_ESP32_DEVKIT_V1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="${boards.dir}/sdkconfig/sdkconfig.defaults.esp32_4mb;sdkconfig.defaults"

; 38-pin ESP32 DEVKIT V1 clone with ESP32-WROOM-32U: EXTERNAL antenna (U.FL),
; NO user LED (only the red power LED). Same memory/sdkconfig as above.
; (verified with esptool on Module 12: ESP32-D0WD-V3, 4 MB flash, no PSRAM)
[hw_esp32_devkit38_wroom32u]
extends = hw_doit_esp32
build_flags = -I ${boards.dir}/include -DBOARD_ESP32_DEVKIT_V1_38PIN -DBOARD_ANTENNA_EXTERNAL=1

; ESP32-S3-DevKitC-1 N16R8 - WROOM-1: 16 MB QUAD flash (3.3 V) + 8 MB octal PSRAM
; (verified with esptool on Modules 14-18: "Flash type set in eFuse: quad", 3.3 V)
[hw_s3_devkitc_n16r8]
extends = boards_base
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags = -I ${boards.dir}/include -DBOARD_S3_DEVKITC1_N16R8 -DBOARD_HAS_PSRAM
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="${boards.dir}/sdkconfig/sdkconfig.defaults.s3_n16r8;sdkconfig.defaults"

; ESP32-S3-DevKitC-1U N16R8 - WROOM-1U: same as above, but EXTERNAL antenna (U.FL)
; instead of the PCB antenna. Electrically identical, same sdkconfig.
[hw_s3_devkitc_n16r8u]
extends = hw_s3_devkitc_n16r8
build_flags = ${hw_s3_devkitc_n16r8.build_flags} -DBOARD_ANTENNA_EXTERNAL=1

; ESP32-S3-DevKitC-1 N32R16V - WROOM-2: 32 MB OCTAL flash (1.8 V) + 16 MB octal PSRAM
; Genuine Espressif board: CP210x USB-UART on the "UART" port (flash + console),
; native USB-Serial-JTAG on the "USB" port (debug/JTAG).
[hw_s3_devkitc_n32r16v]
extends = boards_base
board = esp32-s3-devkitc-1
board_build.flash_mode = dout
board_build.arduino.memory_type = opi_opi
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
build_flags = -I ${boards.dir}/include -DBOARD_S3_DEVKITC1_N32R16V -DBOARD_HAS_PSRAM
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="${boards.dir}/sdkconfig/sdkconfig.defaults.s3_n32r16v;sdkconfig.defaults"

; LILYGO T-SIM7080G-S3 - ESP32-S3-WROOM-1-N16R8 + SIM7080G modem, variant WITHOUT PMU.
; No USB-UART chip: upload/console over the S3's native USB (USB-Serial-JTAG).
[hw_lilygo_tsim7080g_s3]
extends = boards_base
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags = -I ${boards.dir}/include -DBOARD_LILYGO_T_SIM7080G_S3 -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="${boards.dir}/sdkconfig/sdkconfig.defaults.s3_n16r8;${boards.dir}/sdkconfig/sdkconfig.defaults.usb_console;sdkconfig.defaults"

; ===== physical modules (inventory) ===========================================
; One section per physical board: hardware type + module number + COM ports.
; ${env.build_flags} appends the project's app-wide flags.
; upload_port / monitor_port = the board's USB-UART port ("UART" plug: flash + console).
; custom_usb_port = the S3's native USB-Serial-JTAG port ("USB" plug: debug/JTAG);
;   informational only, e.g. for "pio device monitor -p <port>".
; Port numbers verified on the development PC (2026-11-25).

[env:m12_doit_esp32]
extends = hw_esp32_devkit38_wroom32u
build_flags = ${hw_esp32_devkit38_wroom32u.build_flags} -DBOARD_MODULE_ID=12 ${env.build_flags}
upload_port = COM4
monitor_port = COM4

[env:m13_doit_esp32]
; PRODUCTION unit: Oliver Water Meter Controller, deployed at Oliver.
; Same hardware as Module 12. Updated over the air (ElegantOTA web page), so no COM port here.
; GUARD: uploads from PlatformIO always fail. Without a port, PlatformIO would pick any
; connected board and put the PRODUCTION build on a lab board. Building is fine: upload
; the resulting firmware.bin via the device's ElegantOTA page.
extends = hw_esp32_devkit38_wroom32u
build_flags = ${hw_esp32_devkit38_wroom32u.build_flags} -DBOARD_MODULE_ID=13 ${env.build_flags}
upload_protocol = custom
upload_command = echo *** Module 13 is the PRODUCTION unit: no uploads from PlatformIO. Update it via its ElegantOTA web page. *** && exit 1

[env:m14_esp32s3]
extends = hw_s3_devkitc_n16r8
build_flags = ${hw_s3_devkitc_n16r8.build_flags} -DBOARD_MODULE_ID=14 ${env.build_flags}
upload_port = COM10
monitor_port = COM10
custom_usb_port = COM5

[env:m15_esp32s3]
extends = hw_s3_devkitc_n16r8
build_flags = ${hw_s3_devkitc_n16r8.build_flags} -DBOARD_MODULE_ID=15 ${env.build_flags}
upload_port = COM7
monitor_port = COM7
custom_usb_port = COM6

[env:m16_esp32s3]
extends = hw_s3_devkitc_n16r8
build_flags = ${hw_s3_devkitc_n16r8.build_flags} -DBOARD_MODULE_ID=16 ${env.build_flags}
upload_port = COM9
monitor_port = COM9
custom_usb_port = COM8

[env:m17_esp32s3]
extends = hw_s3_devkitc_n16r8u
build_flags = ${hw_s3_devkitc_n16r8u.build_flags} -DBOARD_MODULE_ID=17 ${env.build_flags}
upload_port = COM12
monitor_port = COM12
custom_usb_port = COM17

[env:m18_esp32s3]
extends = hw_s3_devkitc_n16r8u
build_flags = ${hw_s3_devkitc_n16r8u.build_flags} -DBOARD_MODULE_ID=18 ${env.build_flags}
upload_port = COM13
monitor_port = COM13
custom_usb_port = COM18

[env:m19_esp32s3]
extends = hw_s3_devkitc_n32r16v
build_flags = ${hw_s3_devkitc_n32r16v.build_flags} -DBOARD_MODULE_ID=19 ${env.build_flags}
upload_port = COM14                    ; CP210x USB-UART ("UART" plug)
monitor_port = COM14
custom_usb_port = COM16

[env:m20_lilygo_sim7080g]
extends = hw_lilygo_tsim7080g_s3
build_flags = ${hw_lilygo_tsim7080g_s3.build_flags} -DBOARD_MODULE_ID=20 ${env.build_flags}
; COM port not known yet - set upload_port / monitor_port once it is plugged in
